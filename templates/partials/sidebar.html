{% load static %}
{% block sidebar %}
<!-- ========== Left Sidebar Start ========== -->
<div class="vertical-menu">
  <div data-simplebar class="h-100">
    <!--- Sidemenu -->
    <div id="sidebar-menu">
      <!-- Left Menu Start -->
      <ul class="metismenu list-unstyled" id="side-menu">
        <li class="menu-title" key="t-menu">Menu</li>
        

        <li>
          <a href="{{ redirect_url }}" class="waves-effect">
            <i class="bx bx-home-circle"></i>
            <span class="badge rounded-pill bg-info float-end"></span>
            <span key="t-dashboard">My Dashboard</span>
          </a>
        </li>
        

        {% if user_dealerships %}
         {% for dealership in user_dealerships %}
 
        <li>
          <a href="{% url 'dashboard:dealer_dashboard' dealership.id %}" class="waves-effect">
            <i class="bx bx-layout"></i>
            <span key="t-projects">{{dealership.name}}</span>
          </a>
        </li>
        {% endfor %}
        {% endif %}
      </ul>

    </div>
    <!-- Sidebar -->
  </div>
</div>
<!-- Left Sidebar End -->
{% endblock %}
